services:
  mongo:
    image: mongo:7
    container_name: pulse-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # Mongoose transactions and change streams require a replica set, and the
    # rollup job's bulk upserts are much easier to reason about with one.
    # A single-node replica set gives us that without running three containers.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - pulse-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Runs once, initialises the replica set, then exits. Idempotent: re-running
  # against an already-initialised set is a no-op.
  mongo-init:
    image: mongo:7
    container_name: pulse-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status().ok } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] })
          }
        '

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pulse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pulse-mongo-data:
  pulse-redis-data:
